<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدباح - مزاد إلكتروني</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <div class="container header-content">
    <h1>🔨 الدباح</h1>
    <p>مزادك الإلكتروني للموازين والعُدد</p>
  </div>
</header>

<main class="container">
  <h2 class="section-title">المنتجات المتاحة</h2>
  <div id="products-grid" class="products-grid">
    <p class="loading">جاري التحميل...</p>
  </div>
</main>

<!-- نافذة تسجيل المستخدم -->
<div id="user-modal" class="modal hidden">
  <div class="modal-content">
    <h3>سجّل بياناتك قبل المزايدة</h3>
    <p>اكتب اسمك ورقم تليفونك</p>
    <input type="text" id="user-name" placeholder="الاسم" />
    <input type="tel" id="user-phone" placeholder="رقم التليفون" />
    <button id="save-user-btn" class="btn-primary">دخول المزاد</button>
  </div>
</div>

<!-- رسالة تأكيد -->
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
